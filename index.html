<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Momentum">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="A private, offline-first fat-loss, strength, cardio, meal schedule, and habit coach.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Momentum Coach</title>
</head>
<body>
  <noscript>
    <div class="noscript">Momentum Coach needs JavaScript enabled.</div>
  </noscript>

  <div id="app" class="app-shell">
    <div id="installBanner" class="install-banner hidden" role="status">
      <div>
        <strong>Put Momentum on your Home Screen</strong>
        <span>It opens full screen and works offline.</span>
      </div>
      <button class="button button-small button-light" type="button" data-action="show-install">How</button>
      <button class="icon-button" type="button" aria-label="Dismiss" data-action="dismiss-install">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <header class="topbar">
      <div class="topbar-copy">
        <p id="eyebrow" class="eyebrow">TODAY</p>
        <h1 id="pageTitle">Momentum</h1>
      </div>
      <div class="topbar-actions">
        <button id="offlineIndicator" class="status-pill hidden" type="button" title="Momentum is offline">
          Offline
        </button>
        <button class="avatar-button" type="button" data-nav="coach" aria-label="Open Coach">
          <span id="avatarInitial">N</span>
        </button>
      </div>
    </header>

    <main id="mainContent" class="main-content" tabindex="-1">
      <section id="view-today" class="view active" data-view="today" aria-labelledby="todayHeading">
        <h2 id="todayHeading" class="sr-only">Today</h2>
        <div id="todayContent"></div>
      </section>

      <section id="view-workout" class="view" data-view="workout" aria-labelledby="workoutHeading">
        <h2 id="workoutHeading" class="sr-only">Train</h2>
        <div id="workoutContent"></div>
      </section>

      <section id="view-progress" class="view" data-view="progress" aria-labelledby="progressHeading">
        <h2 id="progressHeading" class="sr-only">Progress</h2>
        <div id="progressContent"></div>
      </section>

      <section id="view-coach" class="view" data-view="coach" aria-labelledby="coachHeading">
        <h2 id="coachHeading" class="sr-only">Coach</h2>
        <div id="coachContent"></div>
      </section>
    </main>

    <button id="quickLogButton" class="quick-log-fab" type="button" data-action="show-quick-log" aria-label="Quick log">
      <span aria-hidden="true">+</span>
    </button>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" type="button" data-nav="today" aria-current="page">
        <span class="nav-icon" data-icon="home"></span>
        <span>Today</span>
      </button>
      <button class="nav-item" type="button" data-nav="workout">
        <span class="nav-icon" data-icon="dumbbell"></span>
        <span>Train</span>
      </button>
      <button class="nav-item" type="button" data-nav="progress">
        <span class="nav-icon" data-icon="chart"></span>
        <span>Progress</span>
      </button>
      <button class="nav-item" type="button" data-nav="coach">
        <span class="nav-icon" data-icon="spark"></span>
        <span>Coach</span>
      </button>
    </nav>
  </div>

  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="iconTemplate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
